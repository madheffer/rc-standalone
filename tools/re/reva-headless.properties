# ReVa headless settings for reva_serve.py.
reva.server.options.server.port=8080
reva.server.options.server.host=127.0.0.1
reva.server.options.server.enabled=true
reva.server.options.api.key.authentication.enabled=false
# Big functions (vrad3's commands) need more than the default 10 s, more so at Idle priority.
reva.server.options.decompiler.timeout.seconds=180
